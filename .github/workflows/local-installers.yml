name: Local Installers

on:
  workflow_dispatch:
  pull_request:
  push:
    tags:
      - 'local-v*'

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            rpm ca-certificates curl tar unzip fontconfig fonts-noto fonts-noto-cjk \
            libatk-bridge2.0-0 libgtk-3-0 libnss3 libasound2t64 libx11-6 \
            libxcomposite1 libxdamage1 libxext6 libxfixes3 libxrandr2 libxcb1

      - name: Install dependencies
        run: npm ci

      - name: Build installers
        run: npm run package

      - name: Verify installer layout
        run: node scripts/verify-local-installer-layout.mjs

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mediagen-local-${{ runner.os }}-${{ runner.arch }}
          path: dist-local/installers/**
