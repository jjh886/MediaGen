[workspace]
resolver = "2"
members = [
  "apps/server",
  "apps/local-launcher",
  "crates/mediagen-browser-gateway",
  "crates/mediagen-core",
  "crates/mediagen-plugin-runtime",
]

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["MediaGen Team"]

[workspace.dependencies]
actix-files = "0.6"
actix-multipart = "0.7"
actix-web = "4"
actix-ws = "0.3"
async-trait = "0.1"
bytes = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
futures-util = "0.3"
rand = "0.8"
aes = "0.8"
ecb = { version = "0.1", features = ["alloc", "block-padding"] }
md-5 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["image"] }
reqwest = { version = "0.12", default-features = false, features = ["brotli", "deflate", "gzip", "json", "rustls-tls", "socks", "stream", "zstd"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rquickjs = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
