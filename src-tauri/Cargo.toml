[package]
name = "frame64_desktop"
version = "0.1.0"
description = "Frame64 Studio - OpenAI-compatible image and video generation app"
authors = ["Frame64 Team"]
edition = "2021"
default-run = "frame64_desktop"

[lib]
name = "frame64_desktop_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "cookies", "native-tls", "multipart", "stream"], default-features = false }
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
headless_chrome = "1.0.21"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
actix-web = "4"
actix-cors = "0.7"
actix-rt = "2"
bytes = "1"
futures = "0.3"
tokio-stream = "0.1"
base64 = "0.22.1"
sha2 = "0.10"
url = "2"
rquickjs = "0.11"
rand = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
