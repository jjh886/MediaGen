# Windows: 使用更快的链接器
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/DEBUG:NONE"]

# macOS / Linux: 开发时不生成 dsym，加快链接
[target.x86_64-apple-darwin]
rustflags = ["-C", "split-debuginfo=unpacked"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "split-debuginfo=unpacked"]

# 开发构建优化：依赖用 opt-level 1 编译（减少运行时卡顿），本项目代码不优化（加快编译）
[profile.dev.package."*"]
opt-level = 1

[profile.dev]
incremental = true
