[package]
name = "mediagen-server"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
actix-files = { workspace = true }
actix-multipart = { workspace = true }
actix-web = { workspace = true }
actix-ws = { workspace = true }
aes-gcm = "0.10"
aes = { workspace = true }
async-trait = { workspace = true }
base64 = "0.22"
bytes = { workspace = true }
chrono = { workspace = true }
ecb = { workspace = true }
futures-util = { workspace = true }
mediagen-browser-gateway = { path = "../../crates/mediagen-browser-gateway" }
mediagen-core = { path = "../../crates/mediagen-core" }
mediagen-plugin-runtime = { path = "../../crates/mediagen-plugin-runtime" }
md-5 = { workspace = true }
qrcode = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
image = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
uuid = { workspace = true }

wreq = { version = "=6.0.0-rc.31", features = ["json", "form", "multipart", "stream", "socks", "system-proxy", "gzip", "brotli", "deflate", "zstd"] }
wreq-util = { version = "=3.0.0-rc.14", features = ["emulation-serde"] }

[dev-dependencies]
actix-http = "3"
